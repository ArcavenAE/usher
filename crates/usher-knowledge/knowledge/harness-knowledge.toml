# Harness knowledge embedded in each usher release (AD-12).
#
# Every item names its harness, a version range, a reference and the date it
# was last verified. The facts below come from the settings observability
# research map of 2026-11-02, or from the vendor pages named in each reference on
# the date shown. Support entries are usher's own statement: Claude Code offers
# inventory; codex and goose have no adapter yet, so nothing is offered.

schema_version = 1
sequence = 2

[[item]]
id = "claude-code.config-dir-variable"
harness = "claude-code"
layer = "slow"
class = "paths"
versions = ">=2.1.317, <3.0.0"
summary = "CLAUDE_CONFIG_DIR relocates the user config home."
reference = { kind = "vendor-docs", locator = "https://code.claude.com/docs/en/env-vars" }
last_verified = 2026-11-02

[[item]]
id = "codex.home-variable"
harness = "codex"
layer = "slow"
class = "paths"
versions = ">=0.160.1, <1.0.0"
summary = "CODEX_HOME is where the global AGENTS.md and the user config are read from."
reference = { kind = "vendor-docs", locator = "https://learn.chatgpt.com/docs/agent-configuration/agents-md" }
last_verified = 2026-11-02

[[item]]
id = "goose.path-root-variable"
harness = "goose"
layer = "slow"
class = "paths"
versions = ">=1.57.0, <2.0.0"
summary = "GOOSE_PATH_ROOT, when absolute, relocates goose config, data and state."
reference = { kind = "source", locator = "https://raw.githubusercontent.com/aaif-goose/goose/main/crates/goose/src/config/paths.rs" }
last_verified = 2026-11-02

[[item]]
id = "claude-code.user-settings"
harness = "claude-code"
layer = "slow"
class = "paths"
versions = ">=2.1.317, <3.0.0"
summary = "The user settings file is settings.json in the config home; CLAUDE_CONFIG_DIR relocates the home."
locations = [
  { template = "{config_dir}/settings.json", scope = "user", shape = "file" },
]
reference = { kind = "vendor-docs", locator = "https://code.claude.com/docs/en/settings" }
last_verified = 2026-11-10

[[item]]
id = "claude-code.project-settings"
harness = "claude-code"
layer = "slow"
class = "paths"
versions = ">=2.1.317, <3.0.0"
summary = "A project has a shared .claude/settings.json and a personal .claude/settings.local.json."
locations = [
  { template = "{root}/.claude/settings.json", scope = "project", shape = "file" },
  { template = "{root}/.claude/settings.local.json", scope = "local", shape = "file" },
]
reference = { kind = "vendor-docs", locator = "https://code.claude.com/docs/en/settings" }
last_verified = 2026-11-10

[[item]]
id = "claude-code.global-config-file"
harness = "claude-code"
layer = "slow"
class = "paths"
versions = ">=2.1.317, <3.0.0"
summary = "Claude Code writes its own state to .claude.json, in the home or, when CLAUDE_CONFIG_DIR is set, under that directory."
locations = [
  { template = "{global_config_dir}/.claude.json", scope = "global-config", shape = "file" },
]
reference = { kind = "vendor-docs", locator = "https://code.claude.com/docs/en/claude-directory" }
last_verified = 2026-11-10

[[item]]
id = "claude-code.remote-settings-cache"
harness = "claude-code"
layer = "slow"
class = "paths"
versions = ">=2.1.317, <3.0.0"
summary = "The cached copy of server-managed settings is remote-settings.json in the config home."
locations = [
  { template = "{config_dir}/remote-settings.json", scope = "managed", shape = "file" },
]
reference = { kind = "vendor-docs", locator = "https://code.claude.com/docs/en/claude-directory" }
last_verified = 2026-11-10

[[item]]
id = "claude-code.managed-settings-files"
harness = "claude-code"
layer = "slow"
class = "paths"
versions = ">=2.1.317, <3.0.0"
summary = "Managed settings files sit in a system directory: managed-settings.json, then the *.json files of managed-settings.d."
locations = [
  { template = "{system}/Library/Application Support/ClaudeCode/managed-settings.json", scope = "managed", shape = "file", platform = "macos" },
  { template = "{system}/Library/Application Support/ClaudeCode/managed-settings.d", scope = "managed", shape = "json-dir", platform = "macos" },
  { template = "{system}/etc/claude-code/managed-settings.json", scope = "managed", shape = "file", platform = "linux" },
  { template = "{system}/etc/claude-code/managed-settings.d", scope = "managed", shape = "json-dir", platform = "linux" },
]
reference = { kind = "vendor-docs", locator = "https://code.claude.com/docs/en/managed-settings" }
last_verified = 2026-11-02

[[item]]
id = "claude-code.settings-keys-cited"
harness = "claude-code"
layer = "fast"
class = "keys"
versions = ">=2.1.317, <3.0.0"
summary = "Top-level settings keys the vendor settings pages name. The list is partial: a key not here is reported as unrecognized, not as invalid."
keys = [
  "$schema", "permissions", "env", "hooks", "model", "fallbackModel", "modelPicker",
  "availableModels", "deniedModels", "modelSettings", "effortLevel", "maxEffortLevel",
  "enabledPlugins", "extraKnownMarketplaces", "spinnerTipsEnabled", "apiKeyHelper",
  "cleanupPeriodDays", "desktopSessionCleanupPeriodDays", "autoMode",
  "disableClaudeAiConnectors", "enableArtifact", "disableArtifact", "isolatePeerMachines",
  "remoteControlAtStartup", "crossSessionInbound", "useAutoModeDuringPlan",
  "syncClaudeAiSkills", "syncClaudeAiPlugins", "allowManagedPermissionRulesOnly",
  "requiredMinimumVersion", "managedSourcesBehavior",
]
reference = { kind = "vendor-docs", locator = "https://code.claude.com/docs/en/settings" }
last_verified = 2026-11-10

[[support]]
harness = "claude-code"
versions = ">=2.1.317, <3.0.0"
capabilities = ["inventory"]

[[support]]
harness = "claude-code"
versions = ">=0.0.0"
capabilities = []

[[support]]
harness = "codex"
versions = ">=0.0.0"
capabilities = []

[[support]]
harness = "goose"
versions = ">=0.0.0"
capabilities = []
