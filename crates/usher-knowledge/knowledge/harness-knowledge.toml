# Harness knowledge embedded in each usher release (AD-12).
#
# Every item names its harness, a version range, a reference and the date it
# was last verified. The facts below come from the settings observability
# research map of 2026-11-02 and cite the sources it cites. Support entries are
# usher's own statement: no adapter exists yet, so nothing is offered.

schema_version = 2
sequence = 2

[[item]]
id = "claude-code.config-dir-variable"
harness = "claude-code"
layer = "slow"
class = "paths"
versions = ">=2.1.317, <3.0.0"
summary = "CLAUDE_CONFIG_DIR relocates the user config home."
reference = { kind = "vendor-docs", locator = "https://code.claude.com/docs/en/env-vars" }
last_verified = 2026-11-02

[[item]]
id = "claude-code.source-managed-file"
harness = "claude-code"
layer = "slow"
class = "sources"
versions = ">=2.1.317, <3.0.0"
summary = "The managed settings file on macOS. Managed sources are first-wins; the file ranks below server-managed and MDM delivery."
reference = { kind = "vendor-docs", locator = "https://code.claude.com/docs/en/managed-settings" }
last_verified = 2026-11-15
source = { path = "/Library/Application Support/ClaudeCode/managed-settings.json", layer = "managed", read = "first-wins", rank = 3 }

[[item]]
id = "claude-code.source-managed-file-linux"
harness = "claude-code"
layer = "slow"
class = "sources"
versions = ">=2.1.317, <3.0.0"
summary = "The managed settings file on Linux and WSL; same tier and rank as the macOS file. The Windows path is not listed yet."
reference = { kind = "vendor-docs", locator = "https://code.claude.com/docs/en/managed-settings" }
last_verified = 2026-11-15
source = { path = "/etc/claude-code/managed-settings.json", layer = "managed", read = "first-wins", rank = 3 }

[[item]]
id = "claude-code.source-user-settings"
harness = "claude-code"
layer = "slow"
class = "sources"
versions = ">=2.1.317, <3.0.0"
summary = "The user settings file; CLAUDE_CONFIG_DIR relocates the folder it lives in."
reference = { kind = "vendor-docs", locator = "https://code.claude.com/docs/en/settings" }
last_verified = 2026-11-15
source = { path = "${CONFIG_DIR}/settings.json", layer = "user", read = "read", rank = 1 }

[[item]]
id = "claude-code.source-project-settings"
harness = "claude-code"
layer = "slow"
class = "sources"
versions = ">=2.1.317, <3.0.0"
summary = "The shared project settings file, in the repository the session starts in."
reference = { kind = "vendor-docs", locator = "https://code.claude.com/docs/en/settings" }
last_verified = 2026-11-15
source = { path = "${REPO}/.claude/settings.json", layer = "project", read = "read", rank = 1 }

[[item]]
id = "claude-code.source-local-settings"
harness = "claude-code"
layer = "slow"
class = "sources"
versions = ">=2.1.317, <3.0.0"
summary = "The personal project settings file, kept out of git."
reference = { kind = "vendor-docs", locator = "https://code.claude.com/docs/en/settings" }
last_verified = 2026-11-15
source = { path = "${REPO}/.claude/settings.local.json", layer = "local", read = "read", rank = 1 }

[[item]]
id = "claude-code.source-global-state"
harness = "claude-code"
layer = "slow"
class = "sources"
versions = ">=2.1.317, <3.0.0"
summary = "The file Claude Code writes for itself: account details, MCP server configurations, per-project state. Whether CLAUDE_CONFIG_DIR relocates it is not stated on the settings page."
reference = { kind = "vendor-docs", locator = "https://code.claude.com/docs/en/settings" }
last_verified = 2026-11-15
source = { path = "${HOME}/.claude.json", layer = "global-state", read = "read", rank = 1 }

[[item]]
id = "claude-code.source-server-managed-cache"
harness = "claude-code"
layer = "slow"
class = "sources"
versions = ">=2.1.317, <3.0.0"
summary = "The cache of server-managed settings, written to ~/.claude/remote-settings.json. Whether CLAUDE_CONFIG_DIR relocates it is not stated; the path uses the config-directory token on the reading that ~/.claude names that folder."
reference = { kind = "vendor-docs", locator = "https://code.claude.com/docs/en/server-managed-settings" }
last_verified = 2026-11-15
source = { path = "${CONFIG_DIR}/remote-settings.json", layer = "server-managed-cache", read = "read", rank = 1 }

[[item]]
id = "codex.home-variable"
harness = "codex"
layer = "slow"
class = "paths"
versions = ">=0.160.1, <1.0.0"
summary = "CODEX_HOME is where the global AGENTS.md and the user config are read from."
reference = { kind = "vendor-docs", locator = "https://learn.chatgpt.com/docs/agent-configuration/agents-md" }
last_verified = 2026-11-02

[[item]]
id = "goose.path-root-variable"
harness = "goose"
layer = "slow"
class = "paths"
versions = ">=1.57.0, <2.0.0"
summary = "GOOSE_PATH_ROOT, when absolute, relocates goose config, data and state."
reference = { kind = "source", locator = "https://raw.githubusercontent.com/aaif-goose/goose/main/crates/goose/src/config/paths.rs" }
last_verified = 2026-11-02

[[support]]
harness = "claude-code"
versions = ">=0.0.0"
capabilities = []

[[support]]
harness = "codex"
versions = ">=0.0.0"
capabilities = []

[[support]]
harness = "goose"
versions = ">=0.0.0"
capabilities = []
