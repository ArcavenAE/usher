last_verified = 2026-11-20
settings_key = { key = "managedSourcesBehavior", merge = "scalar", sensitive = false, scopes = ["managed"] }

[[item]]
id = "claude-code.key-env"
harness = "claude-code"
layer = "fast"
class = "settings-keys"
versions = ">=2.1.317, <3.0.0"
summary = "The environment table. Values are never read or stored; child names print by name only. The one exception is the child env.CLAUDE_CODE_AUTO_MODE_SERVER, which is read by value (see claude-code.key-env-auto-mode-server)."
reference = { kind = "vendor-docs", locator = "https://code.claude.com/docs/en/settings-reference#env" }
last_verified = 2026-11-20
settings_key = { key = "env", merge = "object-merge", sensitive = true, scopes = ["any"] }

[[item]]
id = "claude-code.key-apikeyhelper"
harness = "claude-code"
layer = "fast"
class = "settings-keys"
versions = ">=2.1.317, <3.0.0"
summary = "The command Claude Code runs to get a credential. The value names a command that mints credentials, so it is never read or stored."
reference = { kind = "vendor-docs", locator = "https://code.claude.com/docs/en/settings-reference#apikeyhelper" }
last_verified = 2026-11-24
settings_key = { key = "apiKeyHelper", merge = "scalar", sensitive = true, scopes = ["any"] }

[[item]]
id = "claude-code.key-env-auto-mode-server"
harness = "claude-code"
layer = "fast"
class = "settings-keys"
versions = ">=2.1.317, <3.0.0"
summary = "The one env child usher reads by value, to learn whether auto mode is off. Verified against Claude Code 2.1.329: a value other than 1 turns the auto mode check off. The value is compared to 1 and dropped; it is never stored, logged or shown."
reference = { kind = "vendor-docs", locator = "https://code.claude.com/docs/en/settings-reference#env" }
last_verified = 2026-11-24
settings_key = { key = "env.CLAUDE_CODE_AUTO_MODE_SERVER", merge = "scalar", sensitive = false, scopes = ["any"], readable_reason = "usher reads whether auto mode is turned off; the value is compared to 1 and never stored, logged or shown" }

