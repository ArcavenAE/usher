[[item]]
id = "claude-code.key-automode-classifyallshell"
harness = "claude-code"
layer = "fast"
class = "settings-keys"
versions = ">=2.1.317, <3.0.0"
summary = "The autoMode switch that sends every shell command to the classifier. The settings page, in its section on exceptions to managed settings precedence, says a true from ~/.claude/settings.json or --settings is honored even when a managed source sets false, so the key is not plain scalar precedence."
reference = { kind = "vendor-docs", locator = "https://code.claude.com/docs/en/settings-reference#automode-classifyallshell" }
last_verified = 2026-11-20
settings_key = { key = "autoMode.classifyAllShell", merge = "own-rule", sensitive = false, scopes = ["user", "managed"] }

[[item]]
id = "claude-code.key-model"
harness = "claude-code"
layer = "fast"
class = "settings-keys"
versions = ">=2.1.317, <3.0.0"
summary = "The model setting. The reference says --model takes precedence over ANTHROPIC_MODEL, and both take precedence over this key for one session, including over a managed model."
reference = { kind = "vendor-docs", locator = "https://code.claude.com/docs/en/settings-reference#model" }
last_verified = 2026-11-20
settings_key = { key = "model", merge = "scalar", sensitive = false, scopes = ["any"], overrides = { variable = "ANTHROPIC_MODEL" } }

[[item]]
id = "claude-code.key-policyhelper"
harness = "claude-code"
layer = "fast"
class = "settings-keys"
versions = ">=2.1.317, <3.0.0"
summary = "A managed key that names an executable which computes managed settings at startup. The reference says Claude Code treats the settings it emits as the managed settings for the session."
reference = { kind = "vendor-docs", locator = "https://code.claude.com/docs/en/settings-reference#policyhelper" }
last_verified = 2026-11-20
settings_key = { key = "policyHelper", merge = "scalar", sensitive = false, scopes = ["managed"] }

[[item]]
