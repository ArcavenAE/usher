# Harness knowledge embedded in each usher release (AD-12).
#
# Every item names its harness, a version range, a reference and the date it
# was last verified. The facts below come from the settings observability
# research map of 2026-11-02 and cite the sources it cites. Support entries are
# usher's own statement: no adapter exists yet, so nothing is offered.

schema_version = 6
sequence = 5

[[item]]
id = "claude-code.config-dir-variable"
harness = "claude-code"
layer = "slow"
class = "paths"
versions = ">=2.1.317, <3.0.0"
summary = "CLAUDE_CONFIG_DIR relocates the user config home."
reference = { kind = "vendor-docs", locator = "https://code.claude.com/docs/en/env-vars" }
last_verified = 2026-11-20
variable = { name = "CLAUDE_CONFIG_DIR", binds = "${CONFIG_DIR}", default = "${HOME}/.claude" }

[[item]]
id = "claude-code.source-managed-file"
harness = "claude-code"
layer = "slow"
class = "sources"
versions = ">=2.1.317, <3.0.0"
summary = "The managed settings file on macOS. Managed sources are first-wins; the file ranks below server-managed and MDM delivery."
reference = { kind = "vendor-docs", locator = "https://code.claude.com/docs/en/managed-settings" }
last_verified = 2026-11-15
source = { path = "/Library/Application Support/ClaudeCode/managed-settings.json", layer = "managed", read = "first-wins", rank = 3, always_present = false, platforms = ["macos"] }

[[item]]
id = "claude-code.source-managed-file-linux"
harness = "claude-code"
layer = "slow"
class = "sources"
versions = ">=2.1.317, <3.0.0"
summary = "The managed settings file on Linux and WSL; same tier and rank as the macOS file. The Windows path is not listed yet."
reference = { kind = "vendor-docs", locator = "https://code.claude.com/docs/en/managed-settings" }
last_verified = 2026-11-15
source = { path = "/etc/claude-code/managed-settings.json", layer = "managed", read = "first-wins", rank = 3, always_present = false, platforms = ["linux"] }

[[item]]
id = "claude-code.source-user-settings"
harness = "claude-code"
layer = "slow"
class = "sources"
versions = ">=2.1.317, <3.0.0"
summary = "The user settings file; CLAUDE_CONFIG_DIR relocates the folder it lives in."
reference = { kind = "vendor-docs", locator = "https://code.claude.com/docs/en/settings" }
last_verified = 2026-11-15
source = { path = "${CONFIG_DIR}/settings.json", layer = "user", read = "read", rank = 1, always_present = true }

[[item]]
id = "claude-code.source-project-settings"
harness = "claude-code"
layer = "slow"
class = "sources"
versions = ">=2.1.317, <3.0.0"
summary = "The shared project settings file, read from the directory the session starts in, which is the repository root only when the session starts there."
reference = { kind = "vendor-docs", locator = "https://code.claude.com/docs/en/settings" }
last_verified = 2026-11-15
source = { path = "${LAUNCH_DIR}/.claude/settings.json", layer = "project", read = "read", rank = 1, always_present = true }

[[item]]
id = "claude-code.source-local-settings"
harness = "claude-code"
layer = "slow"
class = "sources"
versions = ">=2.1.317, <3.0.0"
summary = "The personal project settings file, kept out of git. Claude Code reads and writes it at the repository root; it stays beside .claude/settings.json outside a git repository, when the root is the home directory, on Windows, or when the root, .git or .claude is not owned by the user, and a copy an earlier version left in the starting directory is still read."
reference = { kind = "vendor-docs", locator = "https://code.claude.com/docs/en/settings" }
last_verified = 2026-11-15
source = { path = "${REPO}/.claude/settings.local.json", layer = "local", read = "read", rank = 1, always_present = true }

[[item]]
id = "claude-code.source-local-settings-starting-dir"
harness = "claude-code"
layer = "slow"
class = "sources"
versions = ">=2.1.317, <3.0.0"
summary = "A local settings file in the directory the session starts in. The vendor's settings page says: \"Before v2.1.211, Claude Code kept the file in the starting directory. It still reads a file an earlier version left there alongside the root file; where both set the same key, the root's value applies\". Listed only when its path differs from the root file's."
reference = { kind = "vendor-docs", locator = "https://code.claude.com/docs/en/settings" }
last_verified = 2026-11-20
source = { path = "${LAUNCH_DIR}/.claude/settings.local.json", layer = "local", read = "read", rank = 1, always_present = false }

[[item]]
id = "claude-code.source-global-state"
harness = "claude-code"
layer = "slow"
class = "sources"
versions = ">=2.1.317, <3.0.0"
summary = "The file Claude Code writes for itself: account details, MCP server configurations, per-project state. The vendor's directory page says: \"If you set CLAUDE_CONFIG_DIR, every ~/.claude path on this page lives under that directory instead. The same applies to .claude.json, which otherwise sits at ~/.claude.json\"."
reference = { kind = "vendor-docs", locator = "https://code.claude.com/docs/en/claude-directory" }
last_verified = 2026-11-20
source = { path = "${GLOBAL_STATE_DIR}/.claude.json", layer = "global-state", read = "read", rank = 1, always_present = false }

[[item]]
id = "claude-code.global-state-dir-variable"
harness = "claude-code"
layer = "slow"
class = "paths"
versions = ">=2.1.317, <3.0.0"
summary = "CLAUDE_CONFIG_DIR also relocates the global state file. The vendor's directory page says: \"If you set CLAUDE_CONFIG_DIR, every ~/.claude path on this page lives under that directory instead. The same applies to .claude.json, which otherwise sits at ~/.claude.json\". Unset or empty, the file sits in the home directory."
reference = { kind = "vendor-docs", locator = "https://code.claude.com/docs/en/claude-directory" }
last_verified = 2026-11-20
variable = { name = "CLAUDE_CONFIG_DIR", binds = "${GLOBAL_STATE_DIR}", default = "${HOME}" }

[[item]]
id = "claude-code.source-server-managed-cache"
harness = "claude-code"
layer = "slow"
class = "sources"
versions = ">=2.1.317, <3.0.0"
summary = "The cache of server-managed settings, written to ~/.claude/remote-settings.json. The vendor's directory page says: \"If you set CLAUDE_CONFIG_DIR, every ~/.claude path on this page lives under that directory instead. The same applies to .claude.json, which otherwise sits at ~/.claude.json\"; the path uses the config-directory token on the reading that ~/.claude names that folder."
reference = { kind = "vendor-docs", locator = "https://code.claude.com/docs/en/server-managed-settings" }
last_verified = 2026-11-15
source = { path = "${CONFIG_DIR}/remote-settings.json", layer = "server-managed-cache", read = "read", rank = 1, always_present = false }

[[item]]
id = "claude-code.managed-control-keys"
harness = "claude-code"
layer = "fast"
class = "keys"
versions = ">=2.1.317, <3.0.0"
summary = "Settings that control how managed sources are delivered and combined and carry no policy of their own, so a managed file that holds only these delivers nothing."
reference = { kind = "vendor-docs", locator = "https://code.claude.com/docs/en/managed-settings" }
last_verified = 2026-11-20
keys = ["policyHelper", "wslInheritsWindowsSettings", "managedSourcesBehavior"]

[[item]]
id = "claude-code.native-launcher"
harness = "claude-code"
layer = "slow"
class = "paths"
versions = ">=2.1.317, <3.0.0"
summary = "The native installer's launcher on macOS and Linux is a symlink to a file named by its version. A custom launcher or another install method reads as version unknown. Windows reads unknown."
reference = { kind = "vendor-docs", locator = "https://code.claude.com/docs/en/setup" }
last_verified = 2026-11-20
version_from = { launcher = "${HOME}/.local/bin/claude", rule = "symlink-target-last-component", layout = "${HOME}/.local/share/claude/versions/${VERSION}" }

[[item]]
id = "codex.home-variable"
harness = "codex"
layer = "slow"
class = "paths"
versions = ">=0.160.1, <1.0.0"
summary = "CODEX_HOME is where the global AGENTS.md and the user config are read from."
reference = { kind = "vendor-docs", locator = "https://learn.chatgpt.com/docs/agent-configuration/agents-md" }
last_verified = 2026-11-02

[[item]]
id = "goose.path-root-variable"
harness = "goose"
layer = "slow"
class = "paths"
versions = ">=1.57.0, <2.0.0"
summary = "GOOSE_PATH_ROOT, when absolute, relocates goose config, data and state."
reference = { kind = "source", locator = "https://raw.githubusercontent.com/aaif-goose/goose/main/crates/goose/src/config/paths.rs" }
last_verified = 2026-11-02
[[item]]
id = "claude-code.seat-mcp-launch-dir"
harness = "claude-code"
layer = "slow"
class = "seat"
versions = ">=2.1.317, <3.0.0"
summary = "The MCP server names registered in the project's .mcp.json at the directory the session starts in, and the names of each server's env and headers entries; no value is read. The vendor's MCP page says to add the entry under mcpServers in .mcp.json at the project root, and does not say how the root is found after a launch in a subdirectory, so both places are listed and neither is claimed."
reference = { kind = "vendor-docs", locator = "https://code.claude.com/docs/en/mcp" }
last_verified = 2026-11-20
seat = { part = "mcp", path = "${LAUNCH_DIR}/.mcp.json", read = "names", key_paths = ["mcpServers.*", "mcpServers.*.env", "mcpServers.*.headers"] }

[[item]]
id = "claude-code.seat-mcp-repo-root"
harness = "claude-code"
layer = "slow"
class = "seat"
versions = ">=2.1.317, <3.0.0"
summary = "The MCP server names registered in the project's .mcp.json at the repository root, and the names of each server's env and headers entries; no value is read. The vendor's MCP page says to add the entry under mcpServers in .mcp.json at the project root, and does not say how the root is found after a launch in a subdirectory, so both places are listed and neither is claimed."
reference = { kind = "vendor-docs", locator = "https://code.claude.com/docs/en/mcp" }
last_verified = 2026-11-20
seat = { part = "mcp", path = "${REPO}/.mcp.json", read = "names", key_paths = ["mcpServers.*", "mcpServers.*.env", "mcpServers.*.headers"] }

[[item]]
id = "claude-code.seat-auth-env"
harness = "claude-code"
layer = "slow"
class = "seat"
versions = ">=2.1.317, <3.0.0"
summary = "Environment variables that select the backend and the credential Claude Code uses: an API key, an auth token, an OAuth token, or one of three cloud providers. Only whether each is set is read, never its value. Applies to a fleet seat."
reference = { kind = "vendor-docs", locator = "https://code.claude.com/docs/en/env-vars" }
last_verified = 2026-11-20
seat = { part = "auth-route", read = "env", variables = ["ANTHROPIC_API_KEY", "ANTHROPIC_AUTH_TOKEN", "CLAUDE_CODE_OAUTH_TOKEN", "CLAUDE_CODE_USE_BEDROCK", "CLAUDE_CODE_USE_VERTEX", "CLAUDE_CODE_USE_FOUNDRY"] }

[[item]]
id = "claude-code.seat-auth-account"
harness = "claude-code"
layer = "slow"
class = "seat"
versions = ">=2.1.317, <3.0.0"
summary = "Whether the global state file has a top-level oauthAccount key, which marks a subscription login. The vendor page says the file holds account details; the key name itself was observed on one host on 2026-11-20 and is not documented. Only membership is read, never the value or anything under it. Applies to a fleet seat."
reference = { kind = "vendor-docs", locator = "https://code.claude.com/docs/en/claude-directory" }
last_verified = 2026-11-20
seat = { part = "auth-route", path = "${GLOBAL_STATE_DIR}/.claude.json", read = "keys-present", keys = ["oauthAccount"] }


[[item]]
id = "claude-code.layer-stack"
harness = "claude-code"
layer = "slow"
class = "layers"
versions = ">=2.1.317, <3.0.0"
summary = "The order of Claude Code settings layers across files, highest first, from the vendor's settings precedence list. The command line level cannot be observed."
reference = { kind = "vendor-docs", locator = "https://code.claude.com/docs/en/settings" }
last_verified = 2026-11-20
stack = ["managed", "command-line", "local", "project", "user"]

[[item]]
id = "claude-code.key-permissions-allow"
harness = "claude-code"
layer = "fast"
class = "settings-keys"
versions = ">=2.1.317, <3.0.0"
summary = "The permission allow rules; each layer adds its own entries."
reference = { kind = "vendor-docs", locator = "https://code.claude.com/docs/en/settings-reference#permissions-allow" }
last_verified = 2026-11-20
settings_key = { key = "permissions.allow", merge = "list-merge", sensitive = false, scopes = ["any"], profile_ownable = true }

[[item]]
id = "claude-code.key-permissions-ask"
harness = "claude-code"
layer = "fast"
class = "settings-keys"
versions = ">=2.1.317, <3.0.0"
summary = "The permission ask rules; each layer adds its own entries."
reference = { kind = "vendor-docs", locator = "https://code.claude.com/docs/en/settings-reference#permissions-ask" }
last_verified = 2026-11-20
settings_key = { key = "permissions.ask", merge = "list-merge", sensitive = false, scopes = ["any"], profile_ownable = true }

[[item]]
id = "claude-code.key-permissions-deny"
harness = "claude-code"
layer = "fast"
class = "settings-keys"
