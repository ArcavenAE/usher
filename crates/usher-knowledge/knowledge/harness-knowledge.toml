[[item]]
id = "claude-code.key-env"
harness = "claude-code"
layer = "fast"
class = "settings-keys"
versions = ">=2.1.317, <3.0.0"
summary = "The environment table. Values are never read or stored; child names print by name only."
reference = { kind = "vendor-docs", locator = "https://code.claude.com/docs/en/settings-reference#env" }
last_verified = 2026-11-20
settings_key = { key = "env", merge = "object-merge", sensitive = true, scopes = ["any"] }

