[package]
name = "usher-core"
description = "Domain types shared by every usher crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde_json.workspace = true

[features]
# Lets tests send with a descriptor they build. Only usher-core's own
# dev-dependency enables it; no shipping build may (scripts/guard-signer-crates.sh).
test-seam = []

[dev-dependencies]
usher-core = { path = ".", features = ["test-seam"] }
usher-testkit.workspace = true

[lints]
workspace = true
