[workspace]
resolver = "3"
members = [
    "crates/usher",
    "crates/usher-adapter-claude-code",
    "crates/usher-cli",
    "crates/usher-core",
    "crates/usher-knowledge",
    "crates/usher-store",
    "crates/usher-testkit",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
usher-core = { path = "crates/usher-core", version = "0.0.0" }
usher-knowledge = { path = "crates/usher-knowledge", version = "0.0.0" }
usher-cli = { path = "crates/usher-cli", version = "0.0.0" }
usher-store = { path = "crates/usher-store", version = "0.0.0" }
usher-adapter-claude-code = { path = "crates/usher-adapter-claude-code", version = "0.0.0" }
serde_json = "=1.0.154"
toml_edit = "=0.25.19"
minisign-verify = "=0.3.0"
ed25519-dalek = "=3.0.0"
blake2 = "=0.11.0"
rusqlite = { version = "=0.41.1", features = ["bundled"] }
nix = { version = "=0.31.3", default-features = false, features = ["user"] }
usher-testkit = { path = "crates/usher-testkit", version = "0.0.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
