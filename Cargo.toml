[workspace]
resolver = "3"
members = ["crates/usher", "crates/usher-core", "crates/usher-knowledge", "crates/usher-testkit"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
usher-core = { path = "crates/usher-core", version = "0.0.0" }
toml_edit = "=0.25.19"
minisign-verify = "=0.3.0"
ed25519-dalek = "=3.0.0"
blake2 = "=0.11.0"
usher-testkit = { path = "crates/usher-testkit", version = "0.0.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
