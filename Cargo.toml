[workspace]
resolver = "3"
members = ["crates/usher", "crates/usher-core", "crates/usher-testkit"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
usher-core = { path = "crates/usher-core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
