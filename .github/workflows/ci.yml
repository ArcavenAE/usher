name: CI

on:
  push:
    branches: [main]
    # A push that changes only these paths cuts no alpha release. Pull requests
    # keep running every check, so a required check never goes missing.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '_kos/**'
      - '_bmad-output/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # The spine's Rust version. Keep in step with rust-toolchain.toml and mise.toml.
  RUST_TOOLCHAIN: 1.99.1

jobs:
  fmt:
    name: Rustfmt
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
          # macOS runner background traffic, not usher code. The mesu, swdist and
          # configuration hosts are Apple OS update checks, ocsp.edge.digicert.com is
          # a certificate revocation check, apple-relay.cloudflare.com is an Apple relay.
          allowed-endpoints: >
            mesu-cdn.origin-apple.com.akadns.net:443
            ocsp.edge.digicert.com:443
            apple-relay.cloudflare.com:443
            configuration.g.aaplimg.com:443
            swdist.g.aaplimg.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-08-04
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
          # macOS runner background traffic, not usher code. The mesu, swdist and
          # configuration hosts are Apple OS update checks, ocsp.edge.digicert.com is
          # a certificate revocation check, apple-relay.cloudflare.com is an Apple relay.
          allowed-endpoints: >
            mesu-cdn.origin-apple.com.akadns.net:443
            ocsp.edge.digicert.com:443
            apple-relay.cloudflare.com:443
            configuration.g.aaplimg.com:443
            swdist.g.aaplimg.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-08-04
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
          # macOS runner background traffic, not usher code. The mesu, swdist and
          # configuration hosts are Apple OS update checks, ocsp.edge.digicert.com is
          # a certificate revocation check, apple-relay.cloudflare.com is an Apple relay.
          allowed-endpoints: >
            mesu-cdn.origin-apple.com.akadns.net:443
            ocsp.edge.digicert.com:443
            apple-relay.cloudflare.com:443
            configuration.g.aaplimg.com:443
            swdist.g.aaplimg.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-08-04
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - run: cargo test --locked --workspace --all-targets
      - name: Run the doctests, which --all-targets skips
        # The compile_fail doctests are what stop a WireRequest or a Policy from being
        # built or implemented outside usher-core.
        run: cargo test --locked --workspace --doc
      - name: Test the signing-crate guard
        run: scripts/test-guard-signer-crates.sh
      - name: Keep test-only signing crates out of shipping crates
        # usher-testkit carries ed25519-dalek and blake2 for the test signer. No
        # other workspace member may reach them (Story 1.4, director ruling).
        run: scripts/guard-signer-crates.sh

  deny:
    name: Cargo Deny
    # The fleet's EmbarkStudios/cargo-deny-action is a docker action and runs on
    # Linux only, so cargo-deny is installed from a pinned release instead.
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
          # macOS runner background traffic, not usher code. The mesu, swdist and
          # configuration hosts are Apple OS update checks, ocsp.edge.digicert.com is
          # a certificate revocation check, apple-relay.cloudflare.com is an Apple relay.
          allowed-endpoints: >
            mesu-cdn.origin-apple.com.akadns.net:443
            ocsp.edge.digicert.com:443
            apple-relay.cloudflare.com:443
            configuration.g.aaplimg.com:443
            swdist.g.aaplimg.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-08-04
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check advisories licenses bans sources

  # Mint the release tag once, before the build matrix, so every matrix leg and
  # every later job reads the same tag.
  mint-version:
    name: Mint version
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAG="alpha-$(date -u +%Y%m%d-%H%M%S)-$(echo ${{ github.sha }} | head -c 7)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-release:
    name: Build (${{ matrix.target }})
    needs: [fmt, clippy, test, deny, mint-version]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: usher-darwin-arm64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: usher-linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            artifact_name: usher-linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Forwarded from mint-version so later jobs read needs.build-release.outputs.
    outputs:
      version: ${{ needs.mint-version.outputs.version }}
      tag: ${{ needs.mint-version.outputs.tag }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-08-04
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - name: Build release binary
        # The trusted keys are public keys, so they come from a repo variable and
        # not a secret. The release build fails if the list is empty or malformed
        # (usher-knowledge build.rs), so it fails until the variable is set.
        env:
          USHER_TRUSTED_KEYS: ${{ vars.USHER_TRUSTED_KEYS }}
        run: |
          cargo build --locked --release --target ${{ matrix.target }} -p usher
          cp target/${{ matrix.target }}/release/usher ${{ matrix.artifact_name }}
      - name: Verify binary
        run: ./${{ matrix.artifact_name }} --version
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  # Skipped unless the repo variable SIGNING_ENABLED is 'true'. The release then
  # reads "Signed: No (unsigned)".
  sign-and-notarize:
    name: Sign and notarize
    needs: build-release
    if: vars.SIGNING_ENABLED == 'true'
    environment: release
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Download binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries-usher-darwin-arm64
      - name: Import certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain

          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm cert.p12

          curl -sfo /tmp/DeveloperIDG2CA.cer https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security add-certificates -k build.keychain /tmp/DeveloperIDG2CA.cer
          rm /tmp/DeveloperIDG2CA.cer

          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
      - name: Sign binary
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          codesign --force --options runtime \
            --sign "$APPLE_SIGNING_IDENTITY" \
            --timestamp \
            usher-darwin-arm64
      - name: Verify signature
        run: codesign --verify --deep --strict usher-darwin-arm64
      - name: Notarize
        # notarytool takes an archive, not a bare binary. A bare binary cannot be
        # stapled, so Gatekeeper checks the notarization online.
        env:
          APPLE_NOTARIZATION_APPLE_ID: ${{ secrets.APPLE_NOTARIZATION_APPLE_ID }}
          APPLE_NOTARIZATION_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
          APPLE_NOTARIZATION_TEAM_ID: ${{ secrets.APPLE_NOTARIZATION_TEAM_ID }}
        run: |
          ditto -c -k --keepParent usher-darwin-arm64 usher-darwin-arm64.zip
          xcrun notarytool submit usher-darwin-arm64.zip \
            --apple-id "$APPLE_NOTARIZATION_APPLE_ID" \
            --password "$APPLE_NOTARIZATION_PASSWORD" \
            --team-id "$APPLE_NOTARIZATION_TEAM_ID" \
            --wait --timeout 14400
      - name: Upload signed artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-binaries-darwin-arm64
          path: usher-darwin-arm64
          retention-days: 14
      - name: Cleanup keychain
        if: always()
        run: security delete-keychain build.keychain || true

  create-release:
    name: Create release
    needs: [build-release, sign-and-notarize]
    if: |
      always() &&
      needs.build-release.result == 'success' &&
      (needs.sign-and-notarize.result == 'success' || needs.sign-and-notarize.result == 'skipped')
    permissions:
      contents: write
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Download macOS arm64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.sign-and-notarize.result == 'success' && 'signed-binaries-darwin-arm64' || 'binaries-usher-darwin-arm64' }}
          path: dist/
      - name: Download Linux amd64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries-usher-linux-amd64
          path: dist/
      - name: Download Linux arm64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries-usher-linux-arm64
          path: dist/
      - name: List release files
        run: ls -la dist/
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.build-release.outputs.tag }}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "$TAG" \
            --notes "$(cat <<NOTES
          Automated alpha release.

          **Version:** ${{ needs.build-release.outputs.version }}
          **Commit:** ${{ github.sha }}
          **Built with:** Rust (cargo)
          **Signed:** ${{ needs.sign-and-notarize.result == 'success' && 'Yes (Apple Developer ID)' || 'No (unsigned)' }}

          **Binaries:**
          - \`usher-darwin-arm64\`: macOS Apple Silicon
          - \`usher-linux-amd64\`: Linux x86_64
          - \`usher-linux-arm64\`: Linux ARM64
          NOTES
          )" \
            dist/*
      - name: Clean old releases (keep 30)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "${{ github.repository }}" \
            --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease)] | sort_by(.tagName) | reverse | .[30:] | .[].tagName' \
          | while read -r tag; do
              echo "Deleting old release: $tag"
              gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag
            done

  attest-release:
    name: Attest release provenance
    needs: [build-release, sign-and-notarize, create-release]
    # Attest the final bytes on the release: the signed macOS binary when signing
    # ran, plus the Linux binaries. A skipped signing job still gets provenance.
    if: |
      !cancelled() &&
      needs.build-release.result == 'success' &&
      needs.create-release.result == 'success' &&
      (needs.sign-and-notarize.result == 'success' || needs.sign-and-notarize.result == 'skipped')
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Download final release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.build-release.outputs.tag }}"
          mkdir -p release-assets
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --dir release-assets
          echo "Assets to be attested:"
          ls -la release-assets/
      - name: Attest release artifacts
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'release-assets/*'
      - name: Upload attestation bundle to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Publish the Sigstore bundle as a release asset so scanners such as
          # OSSF Scorecard Signed-Releases can see it; the GitHub attestation
          # store is not visible to them.
          cp "${{ steps.attest.outputs.bundle-path }}" attestations.sigstore.json
          gh release upload "${{ needs.build-release.outputs.tag }}" attestations.sigstore.json \
            --repo "${{ github.repository }}" --clobber
